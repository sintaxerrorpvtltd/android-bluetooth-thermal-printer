name: Printer compatibility or print layout issue
description: Report a Bluetooth connection, Chrome printing or receipt-size problem.
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Do not attach real receipts, customer data, payment details, Bluetooth addresses, device serials or authenticated URLs."
  - type: input
    id: version
    attributes:
      label: App release and Android version
      placeholder: "v0.1.0, Android 16"
    validations:
      required: true
  - type: input
    id: printer
    attributes:
      label: Commercial printer model and transport
      description: "Model only; no device-specific address or serial. State Classic, BLE or unknown."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, selected paper size and observed result
      description: "Say whether the size test worked and which system print destination you selected. Redact identifiers from errors."
    validations:
      required: true
